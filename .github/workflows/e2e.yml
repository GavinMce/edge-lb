name: WireGuard end-to-end

# Real kernel WireGuard, systemd and packets in privileged containers. Slow and needs a runner kernel
# with WireGuard, so it is run by hand (Actions -> "WireGuard end-to-end" -> Run workflow), not on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: service
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the static binary
        working-directory: service
        env:
          CC_x86_64_unknown_linux_musl: gcc
        run: cargo build --locked --target x86_64-unknown-linux-musl
      - name: Does this runner have kernel WireGuard?
        run: |
          sudo modprobe wireguard || true
          sudo ip link add probe type wireguard && sudo ip link del probe && echo "WireGuard OK"
      - name: Run the end-to-end test
        run: service/tests/e2e/wireguard.sh
