<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-lb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232f5bea'/%3E%3Cpath d='M4 8h8M9 5l3 3-3 3' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>edge-lb</h1>
    <span id="conn" class="conn" title="Connection to the service"></span>
  </div>
  <div id="summary" class="summary"></div>
  <div class="actions">
    <button id="btn-import" class="ghost" type="button">Import</button>
    <button id="btn-export" class="ghost" type="button">Export</button>
    <button id="btn-add" class="primary" type="button">Add route</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
  </div>
</header>

<main>
  <div id="banner" class="banner" hidden></div>
  <div id="routes" class="routes" aria-live="polite"></div>
  <p id="empty" class="empty" hidden>
    No routes yet. A route sends traffic arriving on an address and port (optionally for specific
    domains) to one or more targets.
  </p>
</main>

<dialog id="editor">
  <form id="editor-form" method="dialog" novalidate>
    <h2 id="editor-title">Route</h2>

    <label class="field">
      <span>Name</span>
      <input id="f-name" required maxlength="80" placeholder="Blog" autocomplete="off">
    </label>

    <div class="row">
      <label class="field grow">
        <span>Listen address</span>
        <input id="f-ip" placeholder="0.0.0.0" autocomplete="off" spellcheck="false">
        <small>Which of this machine's IPs to listen on. <code>0.0.0.0</code> = all.</small>
      </label>
      <label class="field port">
        <span>Port</span>
        <input id="f-port" required inputmode="numeric" placeholder="443" autocomplete="off">
      </label>
    </div>

    <label class="field">
      <span>Domains <em>(optional)</em></span>
      <textarea id="f-domains" rows="2" spellcheck="false" placeholder="example.com&#10;*.example.com"></textarea>
      <small>One per line. Matched on TLS SNI, HTTP Host, or the Minecraft server address.
        <code>*.example.com</code> matches any subdomain. Leave empty to send everything on
        this port to the targets (and as the fallback for unmatched names).</small>
    </label>

    <label class="field">
      <span>Targets</span>
      <textarea id="f-targets" required rows="3" spellcheck="false" placeholder="10.100.0.2:443&#10;10.100.0.3:443"></textarea>
      <small>One <code>ip:port</code> per line (IPv6 as <code>[::1]:80</code>). With several,
        connections are spread round-robin and unhealthy targets are skipped.</small>
    </label>

    <div class="checks">
      <label class="check"><input id="f-proxy" type="checkbox"> Send PROXY protocol v2 <small>(the target must expect it)</small></label>
      <label class="check"><input id="f-enabled" type="checkbox" checked> Enabled</label>
    </div>

    <ul id="editor-errors" class="errors" hidden></ul>

    <div class="buttons">
      <button type="button" id="editor-cancel" class="ghost">Cancel</button>
      <button type="submit" id="editor-save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="login">
  <form id="login-form" method="dialog">
    <h2>Sign in</h2>
    <p class="hint">Paste the API token (the contents of <code>/etc/edge-lb/token</code> on the edge machine).</p>
    <label class="field">
      <span>Token</span>
      <input id="f-token" type="password" autocomplete="current-password" spellcheck="false" required>
    </label>
    <p id="login-error" class="errors-inline" hidden>That token was not accepted.</p>
    <div class="buttons"><button type="submit" class="primary">Sign in</button></div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
